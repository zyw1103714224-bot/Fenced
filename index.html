<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8ef">
  <meta name="description" content="用手指或鼠标画个圈，抓住人群中逃跑的犯人。">
  <title>画地为牢</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js?v=2"></script>
</head>
<body>
  <main class="game">
    <header class="heading">
      <div class="title-wrap">
        <svg class="title-doodle" viewBox="0 0 88 90" fill="none" aria-hidden="true"><path d="M17 56C0 47 17 27 37 22C63 15 84 28 78 45C74 62 42 72 23 63C6 55 14 37 34 33" stroke="#d8aa63" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6"/><path d="m68 9 4-6m8 15 7-1M13 74l-5 7" stroke="#7c9d77" stroke-width="3" stroke-linecap="round"/></svg>
        <h1>画地为牢<span class="title-dot" aria-hidden="true"></span></h1>
      </div>
      <p>用手指或鼠标画个圈，抓住人群中逃跑的犯人。</p>
    </header>
    <section class="playground" aria-label="画地为牢游戏区域">
      <canvas id="scene" aria-label="在人群中寻找黑白条纹衣服的犯人，按住并画一个闭合的圈。" tabindex="0"></canvas>
      <div class="tools">
        <button id="sound" class="icon-button" type="button" aria-label="开启声音" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 4-6 5H2v6h3l6 5V4Z"/><path class="sound-on" d="M15 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/><path class="sound-off" d="m16 9 5 6m0-6-5 6"/></svg>
        </button>
        <button id="restart" class="icon-button" type="button" aria-label="重新开始">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 .8 6.6M4 4v6h6"/></svg>
        </button>
      </div>
      <div id="victory" class="victory" hidden>
        <div class="victory-seal" aria-label="成功抓住犯人" role="status">
          <svg viewBox="0 0 60 60" fill="none" aria-hidden="true"><path d="m30 3 7 5 9 1 3 9 7 6-2 9 2 9-8 5-4 9-9-1-8 3-6-7-9-3-1-9-5-8 5-8 2-9 9-2Z" fill="#739a79"/><circle cx="30" cy="30" r="17" stroke="#f8f7e9" stroke-opacity=".6" stroke-width="1.5"/><path d="m21 30 6 6 12-13" stroke="#fffdf2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <button id="again" class="icon-button again" type="button" aria-label="再玩一次"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 .8 6.6M4 4v6h6"/></svg></button>
      </div>
      <svg class="corner-knot" viewBox="0 0 80 70" fill="none" aria-hidden="true"><path d="M21 49C1 39 5 16 19 19C32 21 27 46 14 57M22 48C40 30 59 37 51 48C44 59 24 49 18 49M20 49l17 16M20 49 5 63" stroke="#d9ad69" stroke-width="6" stroke-linecap="round"/><path d="M21 49C1 39 5 16 19 19C32 21 27 46 14 57M22 48C40 30 59 37 51 48C44 59 24 49 18 49M20 49l17 16M20 49 5 63" stroke="#f5dca1" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 5"/></svg>
    </section>
  </main>
</body>
</html>
